{{define "main"}}
<div class="card">
    <h3>Class: {{.ClassName}}</h3>

    <h4>Add Student</h4>
    <form hx-post="/classes/{{.ClassID}}/students" hx-target="#student-list" hx-swap="innerHTML">
        <div class="form-group">
            <label for="student-name">Student name</label>
            <input type="text" id="student-name" name="name" placeholder="e.g. Alice Smith" required>
        </div>
        <button type="submit">Add Student</button>
    </form>
</div>

<div class="card">
    <h4>Students</h4>
    <div id="student-list">
        {{template "studentList" .}}
    </div>
</div>
{{end}}
